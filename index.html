*{box-sizing:border-box}body{margin:0;background:#eefbfd;color:#123;font:16px system-ui,-apple-system,sans-serif}.w{max-width:720px;margin:auto;padding:12px 12px 86px}.hero{background:linear-gradient(145deg,#052f45,#08728b);color:#fff;padding:22px;border-radius:22px;margin:8px 0 14px}.hero h1{margin:0 0 6px;font-size:32px}.c{background:#fff;border:1px solid #d6e7eb;border-radius:18px;padding:15px;margin:10px 0}.r{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.b{border:0;border-radius:13px;min-height:48px;padding:11px 14px;background:#087c95;color:#fff;font-weight:800;font-size:16px;cursor:pointer}.b.alt{background:#eff7f8;color:#123;border:1px solid #d6e7eb}.b.gold{background:#8b6500}.b.coral{background:#d95c3d}.b.full{width:100%}input{width:100%;padding:12px;border:1px solid #b8ccd2;border-radius:12px;font-size:16px;min-height:48px}label{display:block;font-weight:800;margin:12px 0 5px}.muted{color:#667e88}.small{font-size:12px}.timer{font-weight:900;font-size:38px}.score{font-size:24px;font-weight:900}.prog{height:11px;background:#e4eef1;border-radius:20px;overflow:hidden}.prog i{display:block;height:100%;background:#17a6b4}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fffe;border-top:1px solid #d6e7eb;display:flex;justify-content:center}.tabs div{width:min(720px,100%);display:grid;grid-template-columns:repeat(4,1fr);padding:6px}.tabs button{border:0;background:none;min-height:52px;font-weight:800;color:#557}.tabs .on{background:#e1f6f8;border-radius:12px;color:#087c95}.pill{font-size:12px;font-weight:800;border-radius:20px;padding:5px 8px;background:#e7f4f7}.mission h3{margin:4px 0}.answers{display:grid;gap:7px}.answers .b{text-align:left;background:#f2f8f9;color:#123;border:1px solid #d6e7eb}.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:#052f45;color:#fff;padding:12px 15px;border-radius:12px;max-width:calc(100% - 24px);font-weight:800;z-index:9}.hide{display:none}.stars{font-size:23px}@media(max-width:480px){.hero h1{font-size:28px}.w{padding:8px 8px 82px}}
</style></head><body><main id="a" class="w"><div class="hero"><h1>🐠 Family Aquarium Challenge</h1><div>Loading your aquarium adventure…</div></div><div class="c"><p>If this message does not change, the game script did not load.</p></div></main><div id="t" class="toast hide"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{const U='https://izgzzqewpuxgpmvfhnti.supabase.co',K='sb_publishable_KBEFexa07vddvUjMpci5AQ__VZSnOTL',P='monterey-bay-2026-09-19-v1',s=supabase.createClient(U,K),A=document.getElementById('a'),T=document.getElementById('t');let S={tab:'home',poll:0,tick:0};const e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),q=k=>new URLSearchParams(location.search).get(k),id=()=>crypto.randomUUID?crypto.randomUUID():('fac-'+Date.now()+'-'+Math.random().toString(36).slice(2)),msg=x=>{T.textContent=x;T.classList.remove('hide');clearTimeout(T.x);T.x=setTimeout(()=>T.classList.add('hide'),3000)},url=o=>{let u=new URL(location);u.search='';Object.entries(o).forEach(([k,v])=>v&&u.searchParams.set(k,v));history.replaceState({},'',u)};
async function auth(){let{data:{user}}=await s.auth.getUser();if(user)return user;let{data,error}=await s.auth.signInAnonymously();if(error)throw Error(error.message);return data.user}
function stop(){clearInterval(S.poll);clearInterval(S.tick)}
async function copyText(v){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(v);return true}}catch{}try{let el=document.getElementById('share');if(el){el.focus();el.select();el.setSelectionRange(0,99999);if(document.execCommand&&document.execCommand('copy'))return true}}catch{}return false}
function home(){stop();A.innerHTML=`<div class="hero"><h1>🐠 Family Aquarium Challenge</h1><div>Explore. Learn. Compete. Have fun together.</div></div><div class="c"><h2>Monterey Bay Aquarium</h2><p class="muted">A two-hour family scavenger hunt with animal missions, Fish Finder, trivia and Little Explorers.</p><button class="b full" id="new">🌊 Create Family Challenge</button><button class="b alt full" id="join" style="margin-top:8px">🔗 Join From Invitation Link</button></div><div class="c"><b>Find → Answer → Learn → Score → Explore</b><p class="small muted">No email, password or account needed.</p></div>`;document.getElementById('new').onclick=()=>form('create');document.getElementById('join').onclick=()=>{let x=prompt('Paste the invitation link');if(!x)return;try{let z=new URL(x).searchParams.get('join');if(z){url({join:z});form('join',z)}}catch{msg('Paste the full invitation link')}}}
function kids(){return [...document.querySelectorAll('.kid')].map(x=>x.value.trim()).filter(Boolean)}
function addKid(){let d=document.createElement('div');d.innerHTML='<input class="kid" placeholder="Little Explorer name" maxlength="40" style="margin-top:7px">';document.getElementById('kids').appendChild(d)}
function form(mode,token){stop();A.innerHTML=`<div class="hero"><h1>${mode==='create'?'🌊 Create Challenge':'🐠 You’re Invited!'}</h1><div>${mode==='create'?'You’ll be the host.':'Join the family adventure.'}</div></div><form id="f" class="c"><label>Your first name</label><input id="name" required maxlength="40"><div id="${mode==='create'?'famwrap':'x'}">${mode==='create'?'<label>Family/team name (optional)</label><input id="fam" maxlength="60">':''}</div><label>Little Explorers on this phone</label><div id="kids"></div><button type="button" class="b alt" id="ak">⭐ Add Little Explorer</button><button type="submit" id="submitChallenge" class="b full" style="margin-top:14px">${mode==='create'?'Create Challenge':'Join Challenge'}</button></form>`;const formEl=document.getElementById('f'),addKidBtn=document.getElementById('ak'),nameEl=document.getElementById('name'),famEl=document.getElementById('fam'),submitBtn=document.getElementById('submitChallenge');addKidBtn.addEventListener('click',addKid);formEl.addEventListener('submit',async ev=>{ev.preventDefault();submitBtn.disabled=true;const oldText=submitBtn.textContent;submitBtn.textContent='Working…';try{await auth();let r;if(mode==='create'){let z=await s.rpc('create_family_challenge',{p_package_id:P,p_display_name:nameEl.value.trim(),p_family_name:famEl?famEl.value.trim()||null:null,p_little_explorer_names:kids()});if(z.error)throw z.error;r=z.data[0];localStorage.setItem('invite_'+r.challenge_id,r.invite_token)}else{let z=await s.rpc('join_family_challenge',{p_invite_token:token,p_display_name:nameEl.value.trim(),p_little_explorer_names:kids()});if(z.error)throw z.error;r=z.data[0]}url({challenge:r.challenge_id});game(r.challenge_id)}catch(x){msg(x?.message||String(x));submitBtn.disabled=false;submitBtn.textContent=oldText}})}
async function load(cid){let u=await auth(),r=await Promise.all([s.from('challenges').select('*').eq('id',cid).single(),s.from('participants').select('*').eq('challenge_id',cid).order('joined_at'),s.from('little_explorers').select('*').eq('challenge_id',cid),s.rpc('get_challenge_missions',{p_challenge_id:cid}),s.from('player_mission_progress').select('*').eq('challenge_id',cid),s.from('little_explorer_progress').select('*').eq('challenge_id',cid)]);r.forEach(x=>{if(x.error)throw x.error});S.cid=cid;[S.c,S.ps,S.ks,S.ms,S.pr,S.kp]=r.map(x=>x.data);S.me=S.ps.find(x=>x.user_id===u.id);let f=await s.rpc('get_family_progress',{p_challenge_id:cid});S.fp=f.data?.[0]||{discovered_core:0}}
function left(){let c=S.c;if(c.state==='LOBBY')return c.duration_seconds;if(c.state==='PAUSED')return c.paused_remaining_seconds||0;if(c.state!=='RUNNING')return 0;return Math.max(0,Math.ceil((c.paused_remaining_seconds??c.duration_seconds)-(Date.now()-Date.parse(c.started_at))/1000))}function ft(n){n=Math.max(0,n|0);return `${Math.floor(n/3600)}:${String(Math.floor(n%3600/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function top(){let p=Math.round((S.fp.discovered_core||0)/28*100);return `<div class="c"><div class="r"><div><div class="small muted">FAMILY TIME</div><div id="clock" class="timer">${ft(left())}</div></div><div><div class="small muted">YOUR SCORE</div><div class="score">${S.me?.total_adventure_score||0}</div></div></div><div class="prog"><i style="width:${p}%"></i></div><div class="r small"><b>${S.fp.discovered_core||0}/28 Core</b><span>${e(S.c.state.replaceAll('_',' '))}</span></div></div>`}
function nav(){return `<div class="tabs"><div>${[['home','🏠 Adventure'],['missions','🎯 Missions'],['scores','🏆 Scores'],['kids','⭐ Kids']].map(x=>`<button data-tab="${x[0]}" class="${S.tab===x[0]?'on':''}">${x[1]}</button>`).join('')}</div></div>`}
function lobby(){let inv=localStorage.getItem('invite_'+S.cid),share=inv?location.origin+location.pathname+'?join='+inv:'';let ctl='';if(S.me.is_host&&S.c.state==='LOBBY')ctl='<button class="b full" data-r="start_challenge">▶ Start 2-Hour Challenge</button>';if(S.me.is_host&&S.c.state==='RUNNING')ctl='<button class="b alt" data-r="pause_challenge">⏸ Pause</button> <button class="b coral" data-r="end_timed_challenge">🏁 End</button>';if(S.me.is_host&&S.c.state==='PAUSED')ctl='<button class="b" data-r="resume_challenge">▶ Resume</button>';if(S.c.state==='TIMED_COMPLETE')ctl='<button class="b full" data-r="enter_free_explore">🌊 Keep Exploring</button>';return `<div class="hero"><h1>🌊 ${e(S.c.family_name||'Family Aquarium Challenge')}</h1><div>Monterey Bay Aquarium • Saturday</div></div>${share?`<div class="c"><b>🔗 Invite Family</b><p class="small muted">Send this private link to each family member.</p><input id="share" value="${e(share)}" readonly><button id="shareb" class="b full" style="margin-top:7px">📲 Share Invite</button><button id="copyb" class="b alt full" style="margin-top:7px">📋 Copy Invite Link</button></div>`:''}<div class="c"><h2>${S.c.state==='LOBBY'?'Family Lobby':'Adventure'}</h2><p>${S.ps.length} players • ${S.ks.length} Little Explorers</p>${ctl}</div><div class="c"><h2>Choose an Adventure</h2><button class="b full" data-go="CORE">🎯 Core Missions</button><button class="b coral full" data-go="FISH_FINDER" style="margin-top:7px">🐠 Fish Finder</button><button class="b alt full" data-go="AQUARIUM_DETECTIVE" style="margin-top:7px">🔎 Aquarium Detective</button></div>`}
function card(m){let p=S.pr.find(x=>x.participant_id===S.me.id&&x.mission_id===m.id),act='';if(!p?.found_at)act=`<button class="b full found" data-m="${e(m.id)}">👀 We Found It!</button>`;else if(!p.correct)act=`<div class="answers"><b>🧠 ${e(m.question)}</b>${(m.answers||[]).map((a,i)=>`<button class="b ans" data-m="${e(m.id)}" data-i="${i}">${e(a)}</button>`).join('')}</div>`;else act=`<div class="c" style="background:#ebfaf1"><b>🌊 What You Learned</b><p>${e(m.learning_fact)}</p></div>`;return `<div class="c mission"><span class="pill">${e(m.category.replaceAll('_',' '))}</span><h3>${e(m.icon)} ${e(m.name)}</h3><div class="small muted">📍 ${e(m.area)}</div><p>${e(m.find_prompt)}</p><p class="muted">🔎 ${e(m.hint||'Look carefully!')}</p>${act}</div>`}
function missions(cat=S.cat||'CORE'){S.cat=cat;let z=S.ms.filter(x=>x.category===cat),g={};z.forEach(m=>(g[m.area]??=[]).push(m));return `<div class="hero"><h1>${cat==='CORE'?'🎯 Core Missions':cat==='FISH_FINDER'?'🐠 Fish Finder':'🔎 Aquarium Detective'}</h1><div>Find it first, then answer.</div></div><div class="r"><button class="b ${cat==='CORE'?'':'alt'} filt" data-c="CORE">Core</button><button class="b ${cat==='FISH_FINDER'?'coral':'alt'} filt" data-c="FISH_FINDER">Fish</button><button class="b ${cat==='AQUARIUM_DETECTIVE'?'':'alt'} filt" data-c="AQUARIUM_DETECTIVE">Detective</button></div>${Object.entries(g).map(([a,x])=>`<h2>${e(a)}</h2>${x.map(card).join('')}`).join('')}`}
function scores(){return `<div class="hero"><h1>🏆 Family Scores</h1><div>Friendly competition, shared adventure.</div></div><div class="c">${[...S.ps].sort((a,b)=>b.timed_score-a.timed_score).map((p,i)=>`<div class="r" style="padding:9px 0;border-bottom:1px solid #e2edef"><b>${i<3?['🥇','🥈','🥉'][i]+' ':''}${e(p.display_name)}</b><span class="score">${p.timed_score}</span></div>`).join('')}</div>`}
function kidsView(){let mine=S.ks.filter(x=>x.managing_participant_id===S.me.id),lm=S.ms.filter(x=>x.category==='LITTLE_EXPLORER');return `<div class="hero"><h1>⭐ Little Explorers</h1><div>Simple find-and-point missions.</div></div>${mine.length?mine.map(k=>`<div class="c"><h2>${e(k.display_name)} <span class="stars">${'⭐'.repeat(Math.min(k.stars,10))}</span></h2><b>${k.stars} stars</b></div>${lm.slice(0,10).map(m=>{let d=S.kp.some(x=>x.little_explorer_id===k.id&&x.mission_id===m.id);return `<div class="c"><b>${e(m.icon)} ${e(m.name)}</b><p>${e(m.find_prompt)}</p>${d?'<span class="pill">⭐ Done</span>':`<button class="b gold kd" data-k="${k.id}" data-m="${e(m.id)}">⭐ Found It</button>`}</div>`}).join('')}`).join(''):'<div class="c">No Little Explorers paired with this phone.</div>'}`}
function render(){if(!S.me){A.innerHTML='<div class="c">This phone is not joined to this challenge. Open its invitation link.</div>';return}let b=S.tab==='home'?lobby():S.tab==='missions'?missions():S.tab==='scores'?scores():kidsView();A.innerHTML=top()+b+nav();bind();clearInterval(S.tick);S.tick=setInterval(()=>{let x=document.getElementById('clock');if(x)x.textContent=ft(left())},1000)}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.tab='missions';S.cat=b.dataset.go;render()});document.querySelectorAll('.filt').forEach(b=>b.onclick=()=>{S.cat=b.dataset.c;render()});document.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{const map={start_challenge:'START',pause_challenge:'PAUSE',resume_challenge:'RESUME',end_timed_challenge:'END',enter_free_explore:'FREE_EXPLORE'},label={START:'▶ Challenge started!',PAUSE:'⏸ Challenge paused',RESUME:'▶ Challenge resumed',END:'🏁 Timed challenge ended',FREE_EXPLORE:'🌊 Free Explore started'};b.disabled=true;S.actionBusy=true;try{let x=await s.rpc('challenge_action',{p_challenge_id:S.cid,p_action:map[b.dataset.r]});if(x.error)throw x.error;await load(S.cid);render();msg(label[map[b.dataset.r]]||'Updated')}catch(err){msg(err?.message||String(err));b.disabled=false}finally{S.actionBusy=false}});document.querySelectorAll('.found').forEach(b=>b.onclick=async()=>{b.disabled=true;S.actionBusy=true;try{let x=await s.rpc('mark_mission_found',{p_challenge_id:S.cid,p_mission_id:b.dataset.m,p_client_action_id:id()});if(x.error)throw x.error;msg('✨ Discovery!');await load(S.cid);render()}catch(err){msg(err?.message||String(err));b.disabled=false}finally{S.actionBusy=false}});document.querySelectorAll('.ans').forEach(b=>b.onclick=async()=>{S.actionBusy=true;try{let x=await s.rpc('answer_mission',{p_challenge_id:S.cid,p_mission_id:b.dataset.m,p_answer_index:+b.dataset.i,p_client_action_id:id()});if(x.error)throw x.error;msg(x.data.correct?'🎉 Correct! +'+x.data.points_awarded:'🔎 Not quite — look again.');await load(S.cid);render()}catch(err){msg(err?.message||String(err))}finally{S.actionBusy=false}});document.querySelectorAll('.kd').forEach(b=>b.onclick=async()=>{S.actionBusy=true;try{let x=await s.rpc('complete_little_explorer_mission',{p_challenge_id:S.cid,p_child_id:b.dataset.k,p_mission_id:b.dataset.m,p_client_action_id:id()});if(x.error)throw x.error;msg('⭐ Explorer Star!');await load(S.cid);render()}catch(err){msg(err?.message||String(err))}finally{S.actionBusy=false}});document.getElementById('shareb')?.addEventListener('click',async()=>{let v=document.getElementById('share').value;try{if(navigator.share){await navigator.share({title:'Family Aquarium Challenge',text:'Join our Family Aquarium Challenge!',url:v});return}}catch(err){if(err&&err.name==='AbortError')return}let ok=await copyText(v);msg(ok?'Invite link copied — paste it into your text message.':'Press and hold the invite link above to copy it.')});document.getElementById('copyb')?.addEventListener('click',async()=>{let v=document.getElementById('share').value;let ok=await copyText(v);msg(ok?'Invite link copied!':'Press and hold the invite link above to copy it.')})}
async function game(cid){try{localStorage.setItem('active_challenge',cid);await load(cid);render();clearInterval(S.poll);S.poll=setInterval(async()=>{if(S.actionBusy)return;try{await load(cid);render()}catch{}},3000)}catch(x){A.innerHTML=`<div class="hero"><h1>🐠 Family Aquarium Challenge</h1></div><div class="c"><h2>Setup needed</h2><p>${e(x.message)}</p></div>`}}
let j=q('join'),c=q('challenge')||localStorage.getItem('active_challenge');j?form('join',j):c?game(c):home()})();
</script></body></html>
